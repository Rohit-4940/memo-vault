<div class="page-container">
  <div class="page-header">
    <h1><i class="fas fa-building"></i> Departments</h1>
    @if (isAdmin) {
      <button class="btn btn-primary" (click)="openCreateModal(createModal)"><i class="fas fa-plus"></i> Add Department</button>
    }
  </div>
  <div class="card">
    <div class="table-responsive">
      <table class="table">
        <thead><tr><th>ID</th><th>Name</th><th>Description</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
          @for(d of departments; track d.id) {
            <tr>
              <td>{{ d.id }}</td>
              <td>{{ d.name }}</td>
              <td>{{ d.description }}</td>
              <td><span class="badge" [class.badge-success]="d.status === 'ACTIVE'" [class.badge-danger]="d.status !== 'ACTIVE'">{{ d.status }}</span></td>
              <td class="actions">
                @if (isAdmin) {
                  <button class="btn btn-sm btn-outline-primary me-1" (click)="openEditModal(editModal, d)"><i class="fas fa-edit"></i></button>
                  <button class="btn btn-sm btn-outline-danger" (click)="deleteDepartment(d.id)"><i class="fas fa-trash"></i></button>
                } @else {
                  <span class="text-muted small">View only</span>
                }
              </td>
            </tr>
          } @empty { <tr><td colspan="5" class="text-center text-muted py-4">No departments found</td></tr> }
        </tbody>
      </table>
    </div>
  </div>
</div>

<ng-template #createModal let-modal>
  <div class="modal-header"><h5 class="modal-title">Add Department</h5><button type="button" class="btn-close" (click)="modal.dismiss()"></button></div>
  <div class="modal-body">
    <div class="form-group mb-3"><label>Name</label><input class="form-control" [(ngModel)]="selectedDepartment.name" required></div>
    <div class="form-group mb-3"><label>Description</label><textarea class="form-control" rows="3" [(ngModel)]="selectedDepartment.description"></textarea></div>
    <div class="form-group mb-3"><label>Status</label>
      <select class="form-control" [(ngModel)]="selectedDepartment.status">
        <option value="ACTIVE">Active</option><option value="INACTIVE">Inactive</option>
      </select>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-secondary" (click)="modal.dismiss()">Cancel</button>
    <button class="btn btn-primary" (click)="saveDepartment()">Save</button>
  </div>
</ng-template>

<ng-template #editModal let-modal>
  <div class="modal-header"><h5 class="modal-title">Edit Department</h5><button type="button" class="btn-close" (click)="modal.dismiss()"></button></div>
  <div class="modal-body">
    <div class="form-group mb-3"><label>Name</label><input class="form-control" [(ngModel)]="selectedDepartment.name" required></div>
    <div class="form-group mb-3"><label>Description</label><textarea class="form-control" rows="3" [(ngModel)]="selectedDepartment.description"></textarea></div>
    <div class="form-group mb-3"><label>Status</label>
      <select class="form-control" [(ngModel)]="selectedDepartment.status">
        <option value="ACTIVE">Active</option><option value="INACTIVE">Inactive</option>
      </select>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-secondary" (click)="modal.dismiss()">Cancel</button>
    <button class="btn btn-primary" (click)="saveDepartment()">Save</button>
  </div>
</ng-template>
