<div class="page-container">
  <div class="page-header">
    <h1><i class="fas fa-wallet"></i> Budget Allocations</h1>
    @if (isAdmin) {
      <button class="btn btn-primary" (click)="openCreateModal(createModal)"><i class="fas fa-plus"></i> Add Budget</button>
    }
  </div>
  <div class="card">
    <div class="card-body p-0">
      <app-advanced-table
        [columns]="columns"
        [data]="data"
        [totalElements]="totalElements"
        [loading]="loading"
        [pageNumber]="pageNumber"
        [pageSize]="pageSize"
        [totalPages]="totalPages"
        [searchable]="true"
        [showFilters]="true"
        filterMode="panel"
        searchPlaceholder="Search budgets..."
        (searchChange)="onSearch($event)"
        (pageChange)="onPageChange($event)"
        (sizeChange)="onSizeChange($event)"
        (sortChange)="onSortChange($event)"
        (filterChange)="onFilterChange($event)"
      >
        <ng-template #actions let-row>
          @if (isAdmin) {
            <button class="btn btn-sm btn-outline-primary me-1" (click)="openEditModal(editModal, row); $event.stopPropagation()"><i class="fas fa-edit"></i></button>
            <button class="btn btn-sm btn-outline-danger" (click)="deleteBudget(row.id); $event.stopPropagation()"><i class="fas fa-trash"></i></button>
          } @else {
            <span class="text-muted small">View only</span>
          }
        </ng-template>
      </app-advanced-table>
    </div>
  </div>
</div>

<ng-template #createModal let-modal>
  <div class="modal-header"><h5 class="modal-title">Add Budget Allocation</h5><button type="button" class="btn-close" (click)="modal.dismiss()"></button></div>
  <div class="modal-body">
    <div class="row">
      <div class="col-md-6 mb-3"><label>Fiscal Year</label>
        <select class="form-control" [(ngModel)]="selectedBudget.fiscalYearId" required>
          <option value="">Select Fiscal Year</option>
          @for(f of fiscalYears; track f.id) { <option [value]="f.id">{{ f.name }}</option> }
        </select>
      </div>
      <div class="col-md-6 mb-3"><label>Department</label>
        <select class="form-control" [(ngModel)]="selectedBudget.departmentId" required>
          <option value="">Select Department</option>
          @for(d of departments; track d.id) { <option [value]="d.id">{{ d.name }}</option> }
        </select>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6 mb-3"><label>Branch <small class="text-muted">(optional)</small></label>
        <select class="form-control" [(ngModel)]="selectedBudget.branchId">
          <option value="">All Branches</option>
          @for(b of branches; track b.id) { <option [value]="b.id">{{ b.name }}</option> }
        </select>
      </div>
      <div class="col-md-6 mb-3"><label>Allocated Amount</label><input class="form-control" type="number" min="0" [(ngModel)]="selectedBudget.allocatedAmount" required></div>
    </div>
    <div class="form-group mb-3"><label>Description</label><textarea class="form-control" rows="3" [(ngModel)]="selectedBudget.description"></textarea></div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-secondary" (click)="modal.dismiss()">Cancel</button>
    <button class="btn btn-primary" (click)="saveBudget()">Save</button>
  </div>
</ng-template>
