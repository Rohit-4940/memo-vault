<div class="page-container">
  <div class="page-header">
    <h1><i class="fas fa-user-shield"></i> Role & Permission</h1>
    <button class="btn btn-primary" (click)="openCreateModal(createModal)">
      <i class="fas fa-plus"></i> Create Role
    </button>
  </div>

  <div class="card">
    <div class="card-body p-0">
      <app-advanced-table
        [columns]="columns"
        [data]="data"
        [totalElements]="totalElements"
        [loading]="loading"
        [pageNumber]="pageNumber"
        [pageSize]="pageSize"
        [totalPages]="totalPages"
        [searchable]="true"
        [showFilters]="true"
        filterMode="panel"
        searchPlaceholder="Search roles..."
        (searchChange)="onSearch($event)"
        (pageChange)="onPageChange($event)"
        (sizeChange)="onSizeChange($event)"
        (sortChange)="onSortChange($event)"
        (filterChange)="onFilterChange($event)"
      >
        <ng-template #actions let-row>
          <button class="btn btn-sm btn-outline-primary me-1" (click)="openEditModal(editModal, row); $event.stopPropagation()"><i class="fas fa-edit"></i></button>
          <button class="btn btn-sm btn-outline-danger" (click)="deleteRole(row.id); $event.stopPropagation()"><i class="fas fa-trash"></i></button>
        </ng-template>
      </app-advanced-table>
    </div>
  </div>
</div>

<ng-template #createModal let-modal>
  <div class="modal-header"><h5 class="modal-title">Create Role</h5><button type="button" class="btn-close" (click)="modal.dismiss()"></button></div>
  <div class="modal-body">
    <div class="row">
      <div class="col-md-6">
        <div class="form-group mb-3"><label>Role Name</label><input class="form-control" [(ngModel)]="selectedRole.roleName" required></div>
      </div>
      <div class="col-md-6">
        <div class="form-group mb-3"><label>Role Type</label>
          <select class="form-control" [(ngModel)]="selectedRole.roleType">
            <option value="SUPER_ADMIN">Super Admin</option><option value="ADMIN">Admin</option>
            <option value="MAKER">Maker</option><option value="APPROVAL">Approval</option>
            <option value="COMMITTEE">Committee</option><option value="USER">User</option>
          </select>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="form-group mb-3"><label>Access Level</label>
          <select class="form-control" [(ngModel)]="selectedRole.roleAccess">
            <option value="ALL">All</option><option value="OWN">Own</option><option value="SPECIFIC">Specific</option>
          </select>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-check mt-4">
          <input class="form-check-input" type="checkbox" id="isApprovable" [(ngModel)]="selectedRole.isRoleApprovable">
          <label class="form-check-label" for="isApprovable">Can Approve Memos</label>
        </div>
      </div>
    </div>
    <div class="form-group mb-3">
      <label>Approval Limit Amount (रू)</label>
      <input class="form-control" type="number" [(ngModel)]="selectedRole.roleApprovalLimitAmount">
    </div>
    <hr>
    <label class="mb-2"><strong>Menu Permissions</strong></label>
    <div class="menu-grid">
      @for(menu of menus; track menu.id) {
        <div class="menu-checkbox" (click)="toggleMenu(menu.id)" [class.selected]="isMenuSelected(menu.id)">
          <i class="{{ menu.faIcon }}"></i>
          <span>{{ menu.menuName }}</span>
          <i class="fas fa-check check-icon" *ngIf="isMenuSelected(menu.id)"></i>
        </div>
      }
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-secondary" (click)="modal.dismiss()">Cancel</button>
    <button class="btn btn-primary" (click)="saveRole()">{{ isEditing ? 'Update' : 'Create' }}</button>
  </div>
</ng-template>

<ng-template #editModal let-modal>
  <div class="modal-header"><h5 class="modal-title">Edit Role: {{ selectedRole.roleName }}</h5><button type="button" class="btn-close" (click)="modal.dismiss()"></button></div>

          <select class="form-control" [(ngModel)]="selectedRole.roleAccess">
            <option value="ALL">All</option><option value="OWN">Own</option><option value="SPECIFIC">Specific</option>
          </select>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-check mt-4">
          <input class="form-check-input" type="checkbox" id="editIsApprovable" [(ngModel)]="selectedRole.isRoleApprovable">

    <hr>
    <label class="mb-2"><strong>Menu Permissions</strong></label>
    <div class="menu-grid">
      @for(menu of menus; track menu.id) {
        <div class="menu-checkbox" (click)="toggleMenu(menu.id)" [class.selected]="isMenuSelected(menu.id)">
          <i class="{{ menu.faIcon }}"></i>
          <span>{{ menu.menuName }}</span>
          <i class="fas fa-check check-icon" *ngIf="isMenuSelected(menu.id)"></i>

    </div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-secondary" (click)="modal.dismiss()">Cancel</button>
    <button class="btn btn-primary" (click)="saveRole()">Save</button>
  </div>
</ng-template>
