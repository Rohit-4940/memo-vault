<div class="page-container">
  <div class="page-header">
    <h1><i class="fas fa-calendar-minus"></i> Leave Management</h1>
    <button class="btn btn-primary" (click)="openCreateModal(createModal)"><i class="fas fa-plus"></i> Request Leave</button>
  </div>
  <div class="card">
    <div class="card-body p-0">
      <app-advanced-table
        [columns]="columns"
        [data]="data"
        [totalElements]="totalElements"
        [loading]="loading"
        [pageNumber]="pageNumber"
        [pageSize]="pageSize"
        [totalPages]="totalPages"
        [searchable]="true"
        [showFilters]="true"
        filterMode="panel"
        searchPlaceholder="Search leaves..."
        (searchChange)="onSearch($event)"
        (pageChange)="onPageChange($event)"
        (sizeChange)="onSizeChange($event)"
        (sortChange)="onSortChange($event)"
        (filterChange)="onFilterChange($event)"
      >
        <ng-template #actions let-row>
          @if (isAdmin && row.status === 'PENDING') {
            <button class="btn btn-sm btn-outline-success me-1" (click)="approveLeave(row.id); $event.stopPropagation()"><i class="fas fa-check"></i></button>
            <button class="btn btn-sm btn-outline-danger me-1" (click)="rejectLeave(row.id); $event.stopPropagation()"><i class="fas fa-times"></i></button>
          }
          @if (!isAdmin && row.status === 'PENDING') {
            <button class="btn btn-sm btn-outline-danger" (click)="cancelLeave(row.id); $event.stopPropagation()"><i class="fas fa-ban"></i></button>
          }
          @if (row.status !== 'PENDING') {
            <span class="text-muted small">-</span>
          }
        </ng-template>
      </app-advanced-table>
    </div>
  </div>
</div>

<ng-template #createModal let-modal>
  <div class="modal-header"><h5 class="modal-title">Request Leave</h5><button type="button" class="btn-close" (click)="modal.dismiss()"></button></div>
  <div class="modal-body">
    <div class="form-group mb-3"><label>Leave Type</label>
      <select class="form-control" [(ngModel)]="selectedLeave.leaveType" required>
        <option value="">Select Type</option>
        <option value="ANNUAL">Annual</option><option value="SICK">Sick</option>
        <option value="PERSONAL">Personal</option><option value="MATERNITY">Maternity</option>
        <option value="PATERNITY">Paternity</option><option value="OTHER">Other</option>
      </select>
    </div>
    <div class="row">
      <div class="col-md-6 mb-3"><label>Start Date</label><input class="form-control" type="date" [(ngModel)]="selectedLeave.startDate" required></div>
      <div class="col-md-6 mb-3"><label>End Date</label><input class="form-control" type="date" [(ngModel)]="selectedLeave.endDate" required></div>
    </div>
    <div class="form-group mb-3"><label>Reason</label><textarea class="form-control" rows="3" [(ngModel)]="selectedLeave.reason" required></textarea></div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-secondary" (click)="modal.dismiss()">Cancel</button>
    <button class="btn btn-primary" (click)="submitLeave()">Submit</button>
  </div>
</ng-template>
