<div class="page-container">
  <div class="page-header">
    <h1><i class="fas fa-building"></i> Branch</h1>
    <button class="btn btn-primary" (click)="openCreateModal(createModal)"><i class="fas fa-plus"></i> Add Branch</button>
  </div>
  <div class="card">
    <div class="table-responsive">
      <table class="table">
        <thead><tr><th>ID</th><th>Name</th><th>Code</th><th>Address</th><th>Email</th><th>Actions</th></tr></thead>
        <tbody>
          @for(b of branches; track b.id) {
            <tr>
              <td>{{ b.id }}</td><td>{{ b.name }}</td><td><span class="badge badge-info">{{ b.branchCode }}</span></td>
              <td>{{ b.streetName }}{{ b.wardNumber ? ', Ward ' + b.wardNumber : '' }}</td>
              <td>{{ b.branchEmail }}</td>
              <td class="actions">
                <button class="btn btn-sm btn-outline-primary me-1" (click)="openEditModal(editModal, b)"><i class="fas fa-edit"></i></button>
                <button class="btn btn-sm btn-outline-danger" (click)="deleteBranch(b.id)"><i class="fas fa-trash"></i></button>
              </td>
            </tr>
          } @empty { <tr><td colspan="6" class="text-center text-muted py-4">No branches found</td></tr> }
        </tbody>
      </table>
    </div>
  </div>
</div>

<ng-template #createModal let-modal>
  <div class="modal-header"><h5 class="modal-title">Add Branch</h5><button type="button" class="btn-close" (click)="modal.dismiss()"></button></div>
  <div class="modal-body">
    <div class="row">
      <div class="col-md-6 mb-3"><label>Branch Name</label><input class="form-control" [(ngModel)]="selectedBranch.name" required></div>
      <div class="col-md-6 mb-3"><label>Branch Code</label><input class="form-control" [(ngModel)]="selectedBranch.branchCode" required></div>
    </div>
    <div class="row">
      <div class="col-md-6 mb-3"><label>Street Name</label><input class="form-control" [(ngModel)]="selectedBranch.streetName"></div>
      <div class="col-md-3 mb-3"><label>Ward Number</label><input class="form-control" [(ngModel)]="selectedBranch.wardNumber"></div>
      <div class="col-md-3 mb-3"><label>Email</label><input class="form-control" type="email" [(ngModel)]="selectedBranch.branchEmail"></div>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-secondary" (click)="modal.dismiss()">Cancel</button>
    <button class="btn btn-primary" (click)="saveBranch()">Save</button>
  </div>
</ng-template>

<ng-template #editModal let-modal>
  <div class="modal-header"><h5 class="modal-title">Edit Branch</h5><button type="button" class="btn-close" (click)="modal.dismiss()"></button></div>
  <div class="modal-body">
    <div class="row">
      <div class="col-md-6 mb-3"><label>Branch Name</label><input class="form-control" [(ngModel)]="selectedBranch.name" required></div>
      <div class="col-md-6 mb-3"><label>Branch Code</label><input class="form-control" [(ngModel)]="selectedBranch.branchCode" required></div>
    </div>
    <div class="row">
      <div class="col-md-6 mb-3"><label>Street Name</label><input class="form-control" [(ngModel)]="selectedBranch.streetName"></div>
      <div class="col-md-3 mb-3"><label>Ward Number</label><input class="form-control" [(ngModel)]="selectedBranch.wardNumber"></div>
      <div class="col-md-3 mb-3"><label>Email</label><input class="form-control" type="email" [(ngModel)]="selectedBranch.branchEmail"></div>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-secondary" (click)="modal.dismiss()">Cancel</button>
    <button class="btn btn-primary" (click)="saveBranch()">Save</button>
  </div>
</ng-template>
