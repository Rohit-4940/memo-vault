<div class="page-container">
  <div class="page-header">
    <h1><i class="fas fa-tag"></i> Memo Types</h1>
    @if (isAdmin) {
      <button class="btn btn-primary" (click)="openCreateModal(createModal)"><i class="fas fa-plus"></i> Add Memo Type</button>
    }
  </div>
  <div class="card">
    <div class="card-body p-0">
      <app-advanced-table
        [columns]="columns"
        [data]="data"
        [totalElements]="totalElements"
        [loading]="loading"
        [pageNumber]="pageNumber"
        [pageSize]="pageSize"
        [totalPages]="totalPages"
        [searchable]="true"
        [showFilters]="true"
        filterMode="panel"
        searchPlaceholder="Search memo types..."
        (searchChange)="onSearch($event)"
        (pageChange)="onPageChange($event)"
        (sizeChange)="onSizeChange($event)"
        (sortChange)="onSortChange($event)"
        (filterChange)="onFilterChange($event)"
      >
        <ng-template #actions let-row>
          @if (isAdmin) {
            <button class="btn btn-sm btn-outline-primary me-1" (click)="openEditModal(editModal, row); $event.stopPropagation()"><i class="fas fa-edit"></i></button>
            <button class="btn btn-sm btn-outline-danger" (click)="deleteMemoType(row.id); $event.stopPropagation()"><i class="fas fa-trash"></i></button>
          } @else {
            <span class="text-muted small">View only</span>
          }
        </ng-template>
      </app-advanced-table>
    </div>
  </div>
</div>

<ng-template #createModal let-modal>
  <div class="modal-header"><h5 class="modal-title">Add Memo Type</h5><button type="button" class="btn-close" (click)="modal.dismiss()"></button></div>
  <div class="modal-body">
    <div class="form-group mb-3"><label>Name</label><input class="form-control" [(ngModel)]="selectedMemoType.name" required></div>
    <div class="form-group mb-3"><label>Description</label><textarea class="form-control" rows="3" [(ngModel)]="selectedMemoType.description"></textarea></div>
    <div class="form-group mb-3"><label>Status</label>
      <select class="form-control" [(ngModel)]="selectedMemoType.status">
        <option value="ACTIVE">Active</option><option value="INACTIVE">Inactive</option>
      </select>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-secondary" (click)="modal.dismiss()">Cancel</button>
    <button class="btn btn-primary" (click)="saveMemoType()">Save</button>
  </div>
</ng-template>

<ng-template #editModal let-modal>
  <div class="modal-header"><h5 class="modal-title">Edit Memo Type</h5><button type="button" class="btn-close" (click)="modal.dismiss()"></button></div>
  <div class="modal-body">
    <div class="form-group mb-3"><label>Name</label><input class="form-control" [(ngModel)]="selectedMemoType.name" required></div>
    <div class="form-group mb-3"><label>Description</label><textarea class="form-control" rows="3" [(ngModel)]="selectedMemoType.description"></textarea></div>
    <div class="form-group mb-3"><label>Status</label>
      <select class="form-control" [(ngModel)]="selectedMemoType.status">
        <option value="ACTIVE">Active</option><option value="INACTIVE">Inactive</option>
      </select>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-secondary" (click)="modal.dismiss()">Cancel</button>
    <button class="btn btn-primary" (click)="saveMemoType()">Save</button>
  </div>
</ng-template>
