<div class="mt-3">
  <div class="row p-0">
    <div class="col-12 col-sm-6 col-md-4">
      <div class="card custom-card shadow">
        <div class="card-body d-flex align-items-center">
          <div class="icon-circle bg-info me-3">
            <i class="bi bi-people"></i>
          </div>
          <div>
            <h5 class="card-title">Users</h5>
            <p class="card-text">95</p>
          </div>
        </div>
      </div>
    </div>

    <div class="col-12 col-sm-6 col-md-4">
      <div class="card custom-card shadow">
        <div class="card-body d-flex align-items-center">
          <div class="icon-circle bg-success me-3">
            <i class="bi bi-person-check"></i>
          </div>
          <div>
            <h5 class="card-title">Active</h5>
            <p class="card-text">87</p>
          </div>
        </div>
      </div>
    </div>

    <div class="col-12 col-sm-6 col-md-4">
      <div class="card custom-card shadow">
        <div class="card-body d-flex align-items-center">
          <div class="icon-circle bg-warning me-3">
            <i class="bi bi-person-x"></i>
          </div>
          <div>
            <h5 class="card-title">Inactive</h5>
            <p class="card-text">8</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row mt-3">
    <div class="col-md-12">
      <div class="shadow p-3 mb-5 bg-body rounded" style="border-top: #ef3238 5px solid;">
        <div class="d-flex justify-content-end mb-2 p-2">
          <button class="btn btn-sm btn-outline-success" (click)="onCreateUserData()">
            Add User <i class="bi bi-person-plus"></i>
          </button>
        </div>
        <app-advanced-table
          [columns]="columns"
          [data]="data"
          [totalElements]="totalElements"
          [loading]="loading"
          [pageNumber]="pageNumber"
          [pageSize]="pageSize"
          [totalPages]="totalPages"
          [searchable]="true"
          [showFilters]="true"
          filterMode="panel"
          searchPlaceholder="Search users..."
          (searchChange)="onSearch($event)"
          (pageChange)="onPageChange($event)"
          (sizeChange)="onSizeChange($event)"
          (sortChange)="onSortChange($event)"
          (filterChange)="onFilterChange($event)"
        >
          <ng-template #actions let-row>
            <button class="btn btn-sm btn-outline-info me-2" (click)="onEditUserData(row?.id, row); $event.stopPropagation()">
              <i class="bi bi-pencil-square" style="color:#28a745"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger" (click)="deleteUserData(row?.username); $event.stopPropagation()">
              <i class="bi bi-trash" style="color:#ec251e"></i>
            </button>
          </ng-template>
        </app-advanced-table>
      </div>
    </div>
  </div>
</div>
