<aside class="sidebar" [class.expanded]="isExpanded">
  <div class="sidebar-brand">
    <div class="sidebar-logo">
      <i class="fas fa-file-alt"></i>
    </div>
    @if (isExpanded) {
      <span class="sidebar-brand-text">{{ 'app.name' | translate }}</span>
    }
  </div>

  <div class="sidebar-menu">
    <div class="sidebar-label">{{ 'sidebar.mainMenu' | translate }}</div>

    @for (item of menuItems; track item.id) {
      <a class="nav-link"
         [routerLink]="item.frontUrl"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{exact: false}"
         [attr.data-tooltip]="!isExpanded ? item.menuName : null">
        <span class="nav-icon">
          <i [class]="item.faIcon || 'fas fa-circle'"></i>
        </span>
        @if (isExpanded) {
          <span class="nav-text">{{ item.menuName }}</span>
        }
      </a>
    }
  </div>

  <div class="sidebar-footer">
    <button class="collapse-btn" (click)="sidebarService.toggleSidebar()">
      <i class="fas fa-chevron-left" [class.rotated]="!isExpanded"></i>
      @if (isExpanded) {
        <span>{{ 'sidebar.collapse' | translate }}</span>
      }
    </button>
  </div>
</aside>
