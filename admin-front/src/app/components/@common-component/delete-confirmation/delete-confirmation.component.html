<div class="modal-header" style="background-color: #ef2f2f; color: white">
  <h5 class="modal-title">{{title}}</h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="cancel()"></button>
</div>
<div class="modal-body">
  {{message}}
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="cancel()">No</button>
  <button type="button" class="btn btn-danger" (click)="confirmDelete()">Yes</button>
</div>
