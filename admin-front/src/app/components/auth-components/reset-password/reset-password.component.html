<div class="login-page">
  <div class="login-bg">
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-icon"><i class="fas fa-key"></i></div>
        <h1>Reset Password</h1>
        <p>Enter your new password</p>
      </div>

      @if (error) {
        <div class="alert alert-error">
          <i class="fas fa-exclamation-circle"></i> <span>{{ error }}</span>
        </div>
      }

      @if (success) {
        <div class="alert alert-success text-center">
          <i class="fas fa-check-circle" style="font-size: 2rem; display: block; margin-bottom: 10px;"></i>
          <strong>Password reset successful!</strong>
          <p class="mt-2">You can now log in with your new password.</p>
        </div>
        <a routerLink="/login" class="btn-login text-center d-block mt-3">
          <i class="fas fa-arrow-right"></i> Go to Login
        </a>
      } @else if (token) {
        <form (ngSubmit)="onSubmit()" class="login-form">
          <div class="form-group">
            <label>New Password</label>
            <div class="input-wrapper">
              <i class="fas fa-lock input-icon"></i>
              <input class="form-control" [type]="showPassword ? 'text' : 'password'"
                     placeholder="Min 8 characters" [(ngModel)]="newPassword" name="newPassword" required>
              <button type="button" class="toggle-password" (click)="togglePassword()">
                <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <div class="input-wrapper">
              <i class="fas fa-check-circle input-icon"></i>
              <input class="form-control" type="password" placeholder="Repeat new password"
                     [(ngModel)]="confirmPassword" name="confirmPassword" required>
            </div>
          </div>
          <button class="btn-login" type="submit" [disabled]="loading || !newPassword || !confirmPassword">
            @if (loading) {
              <span class="spinner spinner-white"></span> <span>Resetting...</span>
            } @else {
              <i class="fas fa-save"></i> <span>Reset Password</span>
            }
          </button>
        </form>
      } @else {
        <p class="text-center text-muted">Invalid reset link. Please request a new one.</p>
        <a routerLink="/forgot-password" class="btn-login text-center d-block mt-3">
          <i class="fas fa-redo"></i> Request Reset
        </a>
      }
    </div>
  </div>
</div>
