<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <div class="text-center mb-4">
            <div class="mb-3" style="font-size: 2.5rem; color: var(--nexmemo-primary);">
              <i class="fas fa-key"></i>
            </div>
            <h4>{{ force ? ('changePassword.expiredTitle' | translate) : ('changePassword.title' | translate) }}</h4>
            <p class="text-muted small mb-0">
              @if (force) {
                {{ 'changePassword.expiredBody' | translate }}
              } @else {
                {{ 'changePassword.normalBody' | translate }}
              }
            </p>
          </div>
          <form #form="ngForm" (ngSubmit)="onSubmit()">
            <div class="form-group mb-3">
              <label>{{ 'changePassword.currentPassword' | translate }}</label>
              <input class="form-control" type="password" [(ngModel)]="obj.currentPassword" name="currentPassword" required [placeholder]="'changePassword.currentPasswordPlaceholder' | translate">
            </div>
            <div class="form-group mb-3">
              <label>{{ 'changePassword.newPassword' | translate }}</label>
              <input class="form-control" type="password" [(ngModel)]="obj.newPassword" name="newPassword" required [placeholder]="'changePassword.newPasswordPlaceholder' | translate">
              <small class="text-muted">{{ 'changePassword.passwordHint' | translate }}</small>
            </div>
            <div class="form-group mb-4">
              <label>{{ 'changePassword.confirmPassword' | translate }}</label>
              <input class="form-control" type="password" [(ngModel)]="obj.confirmPassword" name="confirmPassword" required [placeholder]="'changePassword.confirmPasswordPlaceholder' | translate">
            </div>
            <button class="btn btn-primary w-100" type="submit" [disabled]="spinner">
              @if (spinner) { <span class="spinner-border spinner-border-sm me-2"></span> }
              <i class="fas fa-save me-1"></i> {{ force ? ('changePassword.setNewPassword' | translate) : ('changePassword.submit' | translate) }}
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
