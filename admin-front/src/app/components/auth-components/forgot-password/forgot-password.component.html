<div class="login-page">
  <div class="login-bg">
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-icon"><i class="fas fa-lock"></i></div>
        <h1>Forgot Password</h1>
        <p>Enter your email to receive reset instructions</p>
      </div>

      @if (error) {
        <div class="alert alert-error">
          <i class="fas fa-exclamation-circle"></i> <span>{{ error }}</span>
        </div>
      }

      @if (submitted) {
        <div class="alert alert-success text-center">
          <i class="fas fa-envelope" style="font-size: 2rem; display: block; margin-bottom: 10px;"></i>
          <strong>Check your email</strong>
          <p class="mt-2">If an account exists with that email, we've sent password reset instructions.</p>
        </div>
        <a routerLink="/login" class="btn-login text-center d-block mt-3">
          <i class="fas fa-arrow-left"></i> Back to Login
        </a>
      } @else {
        <form (ngSubmit)="onSubmit()" class="login-form">
          <div class="form-group">
            <label>Email Address</label>
            <div class="input-wrapper">
              <i class="fas fa-envelope input-icon"></i>
              <input class="form-control" type="email" placeholder="you@bank.com" [(ngModel)]="email" name="email" required>
            </div>
          </div>
          <button class="btn-login" type="submit" [disabled]="loading || !email">
            @if (loading) {
              <span class="spinner spinner-white"></span> <span>Sending...</span>
            } @else {
              <i class="fas fa-paper-plane"></i> <span>Send Reset Link</span>
            }
          </button>
          <div class="form-footer">
            <a routerLink="/login"><i class="fas fa-arrow-left"></i> Back to Login</a>
          </div>
        </form>
      }
    </div>

    <div class="login-footer">
      <span>&copy; 2026 NexMemo. All rights reserved.</span>
    </div>
  </div>
</div>
